name: Publish release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package and manifest versions
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          package_version="$(node -e "const fs=require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('package.json','utf8')).version)")"
          manifest_version="$(node -e "const fs=require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('manifest.json','utf8')).version)")"

          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$tag' is not a stable semantic version (X.Y.Z)."
            exit 1
          fi

          if [[ "$tag" != "$package_version" ]]; then
            echo "Tag '$tag' does not match package.json version '$package_version'."
            exit 1
          fi

          if [[ "$tag" != "$manifest_version" ]]; then
            echo "Tag '$tag' does not match manifest.json version '$manifest_version'."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build release assets
        run: npm run build

      - name: Verify release assets
        shell: bash
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            main.js \
            manifest.json \
            styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
